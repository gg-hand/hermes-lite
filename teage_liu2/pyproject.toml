[project]
name = "teage-liu2"
version = "0.1.0"
description = "主干-枝干架构的个人 AI Agent(teage_liu2 重构版,M1 纯对话内核)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "teage_liu2",
    "teage_liu2.core",
    "teage_liu2.server",
]
