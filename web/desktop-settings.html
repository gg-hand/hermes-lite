<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="violet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hermes-lite · 设置</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>~</text></svg>">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/theme.js"></script>
  <style>
    body { padding: 24px 32px; max-width: 720px; margin: 0 auto; }
    .settings-section { margin-bottom: 32px; }
    .settings-section h2 { margin-bottom: 16px; font-size: 16px; font-weight: 600; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-size: 14px; color: var(--text); }
    .settings-value { font-size: 13px; color: var(--text-muted); font-family: monospace; }
    .api-key-input { width: 280px; padding: 6px 10px; font-size: 13px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    .btn-row { display: flex; gap: 8px; }
    .btn-save-key { padding: 6px 12px; font-size: 12px; }
    .btn-delete-key { padding: 6px 12px; font-size: 12px; }
    .accent-picker { display: flex; gap: 8px; }
    .accent-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .accent-dot.is-active { border-color: var(--text); }
    .accent-violet { background: #8b5cf6; }
    .accent-blue { background: #3b82f6; }
    .accent-teal { background: #14b8a6; }
    .accent-amber { background: #f59e0b; }
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 10px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-md); opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 400px; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<h1 style="font-size: 20px; font-weight: 600; margin-bottom: 24px;">Hermes Lite 设置</h1>

<section class="settings-section">
  <h2>模型配置</h2>
  <div class="settings-row">
    <span class="settings-label">OpenAI API Key</span>
    <div class="btn-row">
      <input type="password" class="api-key-input" id="apiKeyOpenai" placeholder="sk-...">
      <button class="btn btn-primary btn-save-key" onclick="saveKey('openai')">保存</button>
      <button class="btn btn-ghost btn-delete-key" onclick="deleteKey('openai')">删除</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">Anthropic API Key</span>
    <div class="btn-row">
      <input type="password" class="api-key-input" id="apiKeyAnthropic" placeholder="sk-ant-...">
      <button class="btn btn-primary btn-save-key" onclick="saveKey('anthropic')">保存</button>
      <button class="btn btn-ghost btn-delete-key" onclick="deleteKey('anthropic')">删除</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">DeepSeek API Key</span>
    <div class="btn-row">
      <input type="password" class="api-key-input" id="apiKeyDeepseek" placeholder="sk-...">
      <button class="btn btn-primary btn-save-key" onclick="saveKey('deepseek')">保存</button>
      <button class="btn btn-ghost btn-delete-key" onclick="deleteKey('deepseek')">删除</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">通义千问 API Key</span>
    <div class="btn-row">
      <input type="password" class="api-key-input" id="apiKeyQwen" placeholder="sk-...">
      <button class="btn btn-primary btn-save-key" onclick="saveKey('qwen')">保存</button>
      <button class="btn btn-ghost btn-delete-key" onclick="deleteKey('qwen')">删除</button>
    </div>
  </div>
</section>

<section class="settings-section">
  <h2>搜索配置</h2>
  <div class="settings-row">
    <span class="settings-label">Bing Search API Key</span>
    <div class="btn-row">
      <input type="password" class="api-key-input" id="apiKeyBing" placeholder="可选">
      <button class="btn btn-primary btn-save-key" onclick="saveKey('bing')">保存</button>
      <button class="btn btn-ghost btn-delete-key" onclick="deleteKey('bing')">删除</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">百度搜索 API Key</span>
    <div class="btn-row">
      <input type="password" class="api-key-input" id="apiKeyBaidu" placeholder="可选">
      <button class="btn btn-primary btn-save-key" onclick="saveKey('baidu')">保存</button>
      <button class="btn btn-ghost btn-delete-key" onclick="deleteKey('baidu')">删除</button>
    </div>
  </div>
</section>

<section class="settings-section">
  <h2>外观</h2>
  <div class="settings-row">
    <span class="settings-label">主题</span>
    <button class="btn btn-ghost btn-sm" onclick="HermesTheme.toggleTheme()">切换深色/浅色</button>
  </div>
  <div class="settings-row">
    <span class="settings-label">强调色</span>
    <div class="accent-picker">
      <span class="accent-dot accent-violet is-active" data-accent="violet" title="电光紫"></span>
      <span class="accent-dot accent-blue" data-accent="blue" title="电光蓝"></span>
      <span class="accent-dot accent-teal" data-accent="teal" title="深青"></span>
      <span class="accent-dot accent-amber" data-accent="amber" title="琥珀"></span>
    </div>
  </div>
</section>

<section class="settings-section">
  <h2>数据目录</h2>
  <div class="settings-row">
    <span class="settings-label">数据存储位置</span>
    <span class="settings-value" id="dataDirPath">加载中...</span>
  </div>
  <div class="settings-row">
    <span class="settings-label">在资源管理器中打开</span>
    <button class="btn btn-ghost btn-sm" onclick="revealDataDir()">打开</button>
  </div>
</section>

<section class="settings-section">
  <h2>关于</h2>
  <div class="settings-row">
    <span class="settings-label">版本</span>
    <span class="settings-value" id="appVersion">v0.1.0</span>
  </div>
  <div class="settings-row">
    <span class="settings-label">Sidecar 端口</span>
    <span class="settings-value" id="sidecarPort">—</span>
  </div>
  <div class="settings-row">
    <span class="settings-label">重启后端服务</span>
    <button class="btn btn-ghost btn-sm" onclick="restartSidecar()">重启</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
  // Tauri 2 withGlobalTauri 模式下 invoke 在 window.__TAURI__.core.invoke，
  // Tauri 1 兼容路径为 window.__TAURI__.invoke
  const __TAURI__ = window.__TAURI__ || {};
  const invoke = (__TAURI__.core && __TAURI__.core.invoke)
               || __TAURI__.invoke
               || (async () => { throw new Error('Tauri invoke not available'); });

  async function loadInitial() {
    try {
      const dir = await invoke('get_data_dir');
      document.getElementById('dataDirPath').textContent = dir;
    } catch (e) { console.error('get_data_dir failed:', e); }

    try {
      const port = await invoke('get_sidecar_port');
      document.getElementById('sidecarPort').textContent = port;
    } catch (e) { console.error('get_sidecar_port failed:', e); }

    try {
      const version = await invoke('get_app_version');
      document.getElementById('appVersion').textContent = 'v' + version;
    } catch (e) { console.error('get_app_version failed:', e); }

    // 加载已保存的 API keys（仅显示是否已设置，不显示明文）
    for (const k of ['openai', 'anthropic', 'deepseek', 'qwen', 'bing', 'baidu']) {
      try {
        const val = await invoke('load_api_key', { keyName: k });
        const input = document.getElementById('apiKey' + k.charAt(0).toUpperCase() + k.slice(1));
        if (val && input) { input.placeholder = '已设置（输入新值覆盖）'; }
      } catch (e) { /* ignore */ }
    }
  }

  async function saveKey(provider) {
    const inputId = 'apiKey' + provider.charAt(0).toUpperCase() + provider.slice(1);
    const input = document.getElementById(inputId);
    const value = input.value.trim();
    if (!value) { showToast('请输入 API Key'); return; }
    try {
      await invoke('save_api_key', { keyName: provider, value: value });
      input.value = '';
      input.placeholder = '已设置（输入新值覆盖）';
      showToast(provider + ' API Key 已保存，需重启后端服务生效');
    } catch (e) {
      showToast('保存失败: ' + e);
    }
  }

  async function deleteKey(provider) {
    try {
      await invoke('delete_api_key', { keyName: provider });
      const inputId = 'apiKey' + provider.charAt(0).toUpperCase() + provider.slice(1);
      const input = document.getElementById(inputId);
      if (input) {
        input.value = '';
        input.placeholder = provider === 'bing' || provider === 'baidu' ? '可选' : 'sk-...';
      }
      showToast(provider + ' API Key 已删除，需重启后端服务生效');
    } catch (e) {
      showToast('删除失败: ' + e);
    }
  }

  async function revealDataDir() {
    try {
      const dir = await invoke('get_data_dir');
      await invoke('reveal_in_explorer', { path: dir });
    } catch (e) { showToast('打开失败: ' + e); }
  }

  async function restartSidecar() {
    showToast('正在重启后端服务...');
    try {
      await invoke('restart_sidecar');
      showToast('后端服务已重启，正在加载聊天页...');
    } catch (e) { showToast('重启失败: ' + e); }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  document.querySelectorAll('.accent-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      document.querySelectorAll('.accent-dot').forEach(d => d.classList.remove('is-active'));
      dot.classList.add('is-active');
      HermesTheme.setAccent(dot.dataset.accent);
    });
  });

  loadInitial();
</script>

</body>
</html>
