<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Lite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #e6edf3;
      user-select: none;
    }
    .titlebar-spacer { height: 40px; }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #21262d;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: #8b95a4;
    }
    .error { display: none; color: #f87171; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="titlebar-spacer"></div>
  <div class="logo">Hermes Lite</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">正在启动...</div>
  <div class="error" id="error"></div>
  <script>
    window.__loadingError = function(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      var el = document.getElementById('error');
      el.textContent = msg || '启动失败，请重试';
      el.classList.add('show');
    };
  </script>
</body>
</html>
