<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hermes-lite · 对话</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>~</text></svg>">

  <!-- CSS: tokens → base → components → chat layout -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/chat.css">

  <!-- 主题初始化（防 FOUC，必须在 body 前执行） -->
  <script src="/static/js/theme.js"></script>
</head>
<body>

<div class="app">
  <!-- 侧边栏遮罩（移动端浮层化时显示，点击关闭侧栏） -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <!-- 侧边栏 -->
  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <h1>hermes<span>-lite</span></h1>
      <div class="sidebar-actions">
        <button class="icon-btn" id="btnNewSession" title="新建会话">+</button>
        <button class="icon-btn" id="btnSettings" title="Agent 设置">&#9881;</button>
      </div>
    </div>
    <!-- Tab 切换：会话 / 记忆 / 文件 -->
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="sessions">会话</button>
      <button class="sidebar-tab" data-tab="memories">记忆</button>
      <button class="sidebar-tab" data-tab="files">文件</button>
    </div>
    <!-- 会话列表 -->
    <div class="session-list tab-pane active" id="sessionList">
      <div class="empty-state"><div class="empty-state-icon">○</div><div class="empty-state-text">暂无会话<br>点击上方 + 新建</div></div>
    </div>
    <!-- 记忆面板 -->
    <div class="memory-panel tab-pane" id="memoryPanel">
      <div class="memory-toolbar">
        <div class="memory-search-row">
          <input type="text" id="memorySearchInput" placeholder="搜索记忆关键词...">
          <button class="memory-search-btn" id="memorySearchBtn">搜索</button>
        </div>
        <div class="memory-filter-row">
          <select id="memoryTypeFilter" title="按类型过滤">
            <option value="all">全部类型</option>
            <option value="fact">fact</option>
            <option value="conversation_turn">conversation_turn</option>
            <option value="relation">relation</option>
            <option value="user_profile">user_profile</option>
          </select>
          <button class="memory-profile-btn" id="btnUserProfile">用户画像</button>
        </div>
      </div>
      <div class="memory-list" id="memoryList">
        <div class="empty-state"><div class="empty-state-icon">○</div><div class="empty-state-text">切换到「记忆」Tab 后<br>点击搜索或选择类型浏览</div></div>
      </div>
    </div>
    <!-- 文件面板 -->
    <div class="file-panel tab-pane" id="filePanel">
      <div class="file-list" id="fileList">
        <div class="file-empty">无已上传文件</div>
      </div>
    </div>
  </aside>

  <!-- 主对话区 -->
  <main class="main">
    <div class="main-header">
      <button class="menu-toggle" id="menuToggle" title="切换侧边栏">&#9776;</button>
      <span class="session-title" id="sessionTitle">未选择会话</span>
      <span class="status-dot" id="statusDot"></span>

      <!-- 主题切换器 -->
      <div class="topbar-actions">
        <a href="/monitor" class="icon-btn" title="监控面板">&#9678;</a>
        <button class="theme-toggle icon-btn" id="themeToggleBtn" title="切换深色/浅色" onclick="HermesTheme.toggleTheme()">◐</button>
        <div class="accent-picker" id="accentPicker">
          <span class="accent-dot accent-amber" data-accent="amber" title="琥珀"></span>
          <span class="accent-dot accent-teal" data-accent="teal" title="深青"></span>
          <span class="accent-dot accent-violet" data-accent="violet" title="紫罗兰"></span>
        </div>
      </div>

      <!-- 调度按钮（跳转独立页） -->
      <a class="schedule-header-btn" href="/scheduler" id="scheduleLink" title="调度管理">
        <span class="schedule-header-icon">&#9201;</span>
        <span class="schedule-header-label">调度</span>
        <span class="schedule-badge" id="scheduleBadge" style="display:none">0</span>
      </a>
    </div>

    <div class="messages" id="messages">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="logo">~$</div>
        <div class="subtitle">Hermes Lite 个人 AI Agent</div>
        <div class="hints">输入消息开始对话 / 侧栏 + 新建会话</div>
      </div>
    </div>

    <div class="input-area">
      <div class="upload-queue" id="uploadQueue"></div>
      <div class="input-area-row">
        <button class="attach-btn" id="attachBtn" title="上传文件">+</button>
        <div class="input-wrapper">
          <textarea id="messageInput" placeholder="输入消息... (Ctrl+Enter 发送)" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
      </div>
      <input type="file" id="fileInput" multiple style="display:none"
             accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.gif">
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Agent 设置</h2>
      <button class="modal-close" onclick="closeModal('settingsModal')">&times;</button>
    </div>
    <div class="modal-body" id="settingsBody">
      <div class="empty-state"><div class="empty-state-text">加载配置中...</div></div>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:space-between">
      <button class="btn btn-danger" id="restartServerBtn">重启服务</button>
      <div>
        <button class="btn btn-secondary" onclick="closeModal('settingsModal')">取消</button>
        <button class="btn btn-primary" id="saveConfigBtn">保存配置</button>
      </div>
    </div>
  </div>
</div>

<!-- 用户画像弹窗 -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <div class="modal-header">
      <h2>用户画像 (memory.md)</h2>
      <button class="modal-close" onclick="closeModal('profileModal')">&times;</button>
    </div>
    <div class="modal-body" id="profileBody">
      <div class="empty-state"><div class="empty-state-text">加载中...</div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('profileModal')">关闭</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- CDN: Markdown + DOMPurify -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<!-- JS 模块（顺序敏感） -->
<script src="/static/js/utils.js"></script>
<script src="/static/js/chat-core.js"></script>
<script src="/static/js/chat-session.js"></script>
<script src="/static/js/chat-memory.js"></script>
<script src="/static/js/chat-schedule-badge.js"></script>
<script src="/static/js/chat-files.js"></script>
<script src="/static/js/chat-settings.js"></script>
<script src="/static/js/chat-main.js"></script>

<script>
// 强调色选择器绑定
document.querySelectorAll('.accent-dot').forEach(dot => {
  dot.addEventListener('click', () => HermesTheme.setAccent(dot.dataset.accent));
});
</script>

</body>
</html>
