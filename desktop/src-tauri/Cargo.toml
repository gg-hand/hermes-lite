[package]
name = "hermes-lite-desktop"
version = "0.1.0"
description = "Hermes Lite desktop shell (Tauri 2 + Python sidecar)"
authors = ["hermes-lite"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"

# 第三方 crate
keyring = "3"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

[features]
# 默认走 dev 模式（不打包 python-build-standalone，使用 HERMES_PYTHON_PATH 指向系统 Python）
default = []
custom-protocol = ["tauri/custom-protocol"]
