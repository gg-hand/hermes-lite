# Teage Liu Nginx 反向代理配置（HTTP，对外 88 → 后端 7007）
# 适用于 Ubuntu/Debian 的 nginx
#
# 端口策略：
#   - 对外监听 88（HTTP）
#   - 反向代理到后端 127.0.0.1:7007（uvicorn 监听）
#   - 后端不对外暴露（systemd 配置 --host 127.0.0.1）
#
# 注意：88 < 1024，需要 root 运行 nginx 或 setcap
#   sudo setcap 'cap_net_bind_service=+ep' /usr/sbin/nginx
#
# 安装:
#   sudo cp nginx-teage-liu.conf /etc/nginx/sites-available/teage-liu
#   sudo ln -sf /etc/nginx/sites-available/teage-liu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 或由 deploy.sh 自动完成上述步骤

# 上游后端定义（便于修改端口）
upstream teage_liu_backend {
    server 127.0.0.1:7007;
    keepalive 32;
}

server {
    listen 88;
    listen [::]:88;

    # ===== 替换为你的实际域名或 IP =====
    server_name _;

    # 字符集
    charset utf-8;

    # 日志
    access_log /var/log/nginx/teage-liu-access.log;
    error_log  /var/log/nginx/teage-liu-error.log;

    # 最大上传（以后你搞文件上传 ETL 用得上）
    client_max_body_size 100m;

    # ========================================
    # 1) 前端页面（根路径）→ 后端根路径
    # ========================================
    location = / {
        proxy_pass http://teage_liu_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # 2) 前端静态资源 → 后端 /static/
    # ========================================
    location /static/ {
        proxy_pass http://teage_liu_backend/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源可缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # 3) API + SSE 流 → 后端根路径
    # ========================================
    location / {
        proxy_pass http://teage_liu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必需：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # 超时设置（SSE 长连接）
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        # HTTP/1.1 支持 keepalive
        proxy_http_version 1.1;
    }
}
