# Hermes Lite Nginx 反向代理配置（HTTP，端口 77）
# 适用于 Ubuntu/Debian 的 nginx
#
# 注意：77 < 1024，需要 root 运行 nginx 或 setcap
#
# 安装:  sudo cp nginx-hermes-lite.conf /etc/nginx/sites-available/hermes-lite
#        sudo ln -sf /etc/nginx/sites-available/hermes-lite /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 88;
    listen [::]:88;

    # ===== 替换为你的实际域名或 IP =====
    server_name _;

    # 字符集
    charset utf-8;

    # 日志
    access_log /var/log/nginx/hermes-lite-access.log;
    error_log  /var/log/nginx/hermes-lite-error.log;

    # 最大上传（以后你搞文件上传 ETL 用得上）
    client_max_body_size 100m;

    # ========================================
    # 1) 前端页面（根路径）→ 后端根路径
    # ========================================
    location = / {
        proxy_pass http://127.0.0.1:7007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # 2) 前端静态资源 → 后端 /static/
    # ========================================
    location /static/ {
        proxy_pass http://127.0.0.1:7007/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源可缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # 3) API + SSE 流 → 后端根路径
    # ========================================
    location / {
        proxy_pass http://127.0.0.1:7007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必需：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # 超时设置（SSE 长连接）
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        # HTTP/1.1 支持 keepalive
        proxy_http_version 1.1;
    }
}
